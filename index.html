          this.shapes[i] = axis === 'h'
            ? this._flipShapeH(this.shapes[i], cx)
            : this._flipShapeV(this.shapes[i], cy);
        });
        this.commit();
        this.hint.textContent = `Flip ${axis === 'h' ? 'horizontal' : 'vertical'} · Ctrl+Z=deshacer`;
        this.render();
      }

      showContextMenu(x, y) {
        const menu = document.getElementById('ctx-menu');
        menu.classList.add('show');
        const mw = menu.offsetWidth  || 180;
        const mh = menu.offsetHeight || 160;
        const left = x + mw > window.innerWidth  ? x - mw : x;
        const top  = y + mh > window.innerHeight ? y - mh : y;
        menu.style.left = left + 'px';
        menu.style.top  = top  + 'px';
      }

      showCanvasContextMenu(x, y) {
        document.getElementById('ctxc-paste').classList.toggle('ctx-disabled', !this.clipboard.length);
        document.getElementById('ctxc-clear').classList.toggle('ctx-disabled', !this.shapes.length);

        const menu = document.getElementById('ctx-menu-canvas');
        menu.classList.add('show');
        const mw = menu.offsetWidth  || 200;
        const mh = menu.offsetHeight || 200;
        menu.style.left = (x + mw > window.innerWidth  ? x - mw : x) + 'px';
        menu.style.top  = (y + mh > window.innerHeight ? y - mh : y) + 'px';
      }

      hideContextMenu() {
        document.getElementById('ctx-menu').classList.remove('show');
        document.getElementById('ctx-menu-canvas').classList.remove('show');
      }

      cancelOp() {
        this.clicks = []; this.dragging = false; this.dragStart = null;
        this.selectedSet.clear();
        this.rubberBand        = null;
        this.rotatingSelected  = false;
        this.rotateCenter      = null;
        this.rotateSnap        = null;
        this.rotateCurrentAngle = 0;
        this.updateHint(); this.render();
      }

      _onKeyDown(e) {
        if (e.target.tagName === 'INPUT') return;
        const key = e.key;

        if (e.code === 'Space' && !this.spaceDown && !e.repeat) {
          e.preventDefault();
          this.spaceDown = true;
          this.updateCursor();
          return;
        }

        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 's') { e.preventDefault(); this.doSave(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'o') { e.preventDefault(); this.doOpen(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'z') { e.preventDefault(); this.undo(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'y') { e.preventDefault(); this.redo(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'd') { e.preventDefault(); this.duplicateSelected(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'c') { e.preventDefault(); this.copySelected(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'x') { e.preventDefault(); this.cutSelected(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'v') { e.preventDefault(); this.pasteClipboard(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'a') { e.preventDefault(); this.selectAll(); return; }
        if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'l') { e.preventDefault(); this.addLayer(); return; }
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && key.toLowerCase() === 'g') { e.preventDefault(); this.groupSelected(); return; }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && key.toLowerCase() === 'g') { e.preventDefault(); this.ungroupSelected(); return; }
        if (key === 'Escape') { this.cancelOp(); return; }

        if ((key === 'Delete' || key === 'Backspace') && this.selectedSet.size > 0) {
          e.preventDefault();
          this.deleteSelected();
          return;
        }

        const map = {
          l: 'line', r: 'rect', c: 'circle', t: 'triangle', a: 'arc',
          v: 'pan', u: 'ruler', e: 'ground', s: 'select'
        };
        if (map[key.toLowerCase()] && !e.ctrlKey && !e.metaKey) {
          this.setTool(map[key.toLowerCase()]);
          return;
        }

        if (key === '+' || key === '=') { this.zoomAt(this.canvas.width / 2, this.canvas.height / 2, this.ZOOM_STEP); this.render(); }
        if (key === '-') { this.zoomAt(this.canvas.width / 2, this.canvas.height / 2, 1 / this.ZOOM_STEP); this.render(); }
        if (key === '0') { this.resetView(); }
        if (key === 'Home') { e.preventDefault(); this.goToOrigin(); }

        if (key.toLowerCase() === 'g') {
          this.snapOn = !this.snapOn;
          document.getElementById('snapToggle').checked = this.snapOn;
          document.getElementById('snapLabel').classList.toggle('on', this.snapOn);
          this.render();
        }

        if (key.toLowerCase() === 'h') {
          this.gridVisible = !this.gridVisible;
          document.getElementById('gridToggleBtn').style.color = this.gridVisible ? '#7eb8f7' : '#4a5568';
          this.render();
        }
      }

      _onKeyUp(e) {
        if (e.code === 'Space') {
          this.spaceDown = false;
          if (this.isPanning && !this.midPan && this.currentTool !== 'pan') {
            this.isPanning = false; this.panLast = null;
          }
          this.updateCursor();
        }
      }

      setTool(name) {
        this.currentTool = name;
        this.clicks = []; this.dragging = false; this.dragStart = null;
        document.querySelectorAll('[data-tool]').forEach(b =>
          b.classList.toggle('active', b.dataset.tool === name)
        );
        this.updateHint();
        this.updateCursor();
        this.render();
      }

      checkTbOverflow() {
        if (this.tbExpanded) return;
        const tb = document.getElementById('toolbar');
        this.TB_GROUPS.forEach(id => {
          const el = document.getElementById(id);
          el.style.display = 'flex';
          el.style.visibility = 'hidden';
        });
        let anyHidden = false;
        for (const id of this.TB_GROUPS) {
          if (tb.scrollWidth <= tb.clientWidth + 1) break;
          document.getElementById(id).style.display = 'none';
          anyHidden = true;
        }
        this.TB_GROUPS.forEach(id => {
          const el = document.getElementById(id);
          if (el.style.display !== 'none') el.style.visibility = '';
        });
        const btn = document.getElementById('tbExpandBtn');
        btn.style.display = anyHidden ? '' : 'none';
        btn.textContent = '≫';
      }

      resize() {
        this.canvas.width = this.wrap.clientWidth;
        this.canvas.height = this.wrap.clientHeight;
        if (!this.tbExpanded) this.checkTbOverflow();
        this.render();
      }




      getShapesBBox() {
        if (!this.shapes.length) {
          const vr = this.visibleRect();
          return { minX: vr.left, minY: vr.top, maxX: vr.right, maxY: vr.bottom };
        }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const ex = (x, y) => {
          minX = Math.min(minX, x); minY = Math.min(minY, y);
          maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
        };
        this.shapes.forEach(s => {
          switch (s.type) {
            case 'line': case 'ruler': case 'ground': ex(s.x1, s.y1); ex(s.x2, s.y2); break;
            case 'rect': ex(s.x, s.y); ex(s.x + s.w, s.y + s.h); break;
            case 'circle': ex(s.cx - s.r, s.cy - s.r); ex(s.cx + s.r, s.cy + s.r); break;
            case 'triangle': ex(s.p1.x, s.p1.y); ex(s.p2.x, s.p2.y); ex(s.p3.x, s.p3.y); break;
            case 'arc': ex(s.cx - s.r, s.cy - s.r); ex(s.cx + s.r, s.cy + s.r); break;
            case 'poly': s.pts.forEach(p => ex(p.x, p.y)); break;
            case 'group': {
              const b = this.shapeBBox(s);
              ex(b.x, b.y); ex(b.x + b.w, b.y + b.h); break;
            }
          }
        });
        return { minX, minY, maxX, maxY };
      }

      r2(n) { return Math.round(n * 100) / 100; }

      buildSVGString() {
        const bbox = this.getShapesBBox();
        const m = this.EXPORT_MARGIN;
        const vx = bbox.minX - m, vy = bbox.minY - m;
        const vw = Math.max(1, bbox.maxX - bbox.minX + m * 2);
        const vh = Math.max(1, bbox.maxY - bbox.minY + m * 2);

        const lines = [
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${this.r2(vx)} ${this.r2(vy)} ${this.r2(vw)} ${this.r2(vh)}" width="${this.r2(vw)}" height="${this.r2(vh)}">`,
          `<rect x="${this.r2(vx)}" y="${this.r2(vy)}" width="${this.r2(vw)}" height="${this.r2(vh)}" fill="white"/>`,
        ];

        const mg = this.GRID * this.GRID_MAJOR;
        const gx0 = Math.floor(vx / this.GRID) * this.GRID;
        const gy0 = Math.floor(vy / this.GRID) * this.GRID;
        let minor = '', major = '';
        for (let x = gx0; x <= vx + vw; x += this.GRID) {
          const seg = `<line x1="${this.r2(x)}" y1="${this.r2(vy)}" x2="${this.r2(x)}" y2="${this.r2(vy + vh)}"/>`;
          if (x % mg === 0) major += seg; else minor += seg;
        }
        for (let y = gy0; y <= vy + vh; y += this.GRID) {
          const seg = `<line x1="${this.r2(vx)}" y1="${this.r2(y)}" x2="${this.r2(vx + vw)}" y2="${this.r2(y)}"/>`;
          if (y % mg === 0) major += seg; else minor += seg;
        }
        lines.push(`<g fill="none" stroke="#ebebeb" stroke-width="0.5">${minor}</g>`);
        lines.push(`<g fill="none" stroke="#d4d4d4" stroke-width="1">${major}</g>`);

        this.shapes.forEach(s => { const el = this.shapeToSVGEl(s); if (el) lines.push(el); });
        lines.push('</svg>');
        return lines.join('\n');
      }

      shapeToSVGEl(s) {
        if (s.type === 'group') {
          return '<g>' + s.children.map(c => this.shapeToSVGEl(c)).join('\n') + '</g>';
        }
        const stroke = '#1a2540', sw = 1.5;
        const base = `fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`;

        switch (s.type) {
          case 'line':
            return `<line x1="${this.r2(s.x1)}" y1="${this.r2(s.y1)}" x2="${this.r2(s.x2)}" y2="${this.r2(s.y2)}" ${base}/>`;
          case 'rect':
            return `<rect x="${this.r2(s.x)}" y="${this.r2(s.y)}" width="${this.r2(s.w)}" height="${this.r2(s.h)}" ${base}/>`;
          case 'poly': {
            const pts = s.pts.map(p => `${this.r2(p.x)},${this.r2(p.y)}`).join(' ');
            return s.closed
              ? `<polygon points="${pts}" ${base}/>`
              : `<polyline points="${pts}" ${base}/>`;
          }
          case 'circle':
            return `<circle cx="${this.r2(s.cx)}" cy="${this.r2(s.cy)}" r="${this.r2(s.r)}" ${base}/>`;
          case 'triangle':
            return `<polygon points="${this.r2(s.p1.x)},${this.r2(s.p1.y)} ${this.r2(s.p2.x)},${this.r2(s.p2.y)} ${this.r2(s.p3.x)},${this.r2(s.p3.y)}" ${base}/>`;
          case 'arc': {
            const { cx, cy, r, sa, ea, ccw } = s;
            const x1 = cx + r * Math.cos(sa), y1 = cy + r * Math.sin(sa);
            const x2 = cx + r * Math.cos(ea), y2 = cy + r * Math.sin(ea);
            const TWO_PI = Math.PI * 2;
            const span = ccw ? ((sa - ea) % TWO_PI + TWO_PI) % TWO_PI : ((ea - sa) % TWO_PI + TWO_PI) % TWO_PI;
            const large = span > Math.PI ? 1 : 0;
            const sweep = ccw ? 0 : 1;
            const d = `M ${this.r2(x1)} ${this.r2(y1)} A ${this.r2(r)} ${this.r2(r)} 0 ${large} ${sweep} ${this.r2(x2)} ${this.r2(y2)}`;
            return `<path d="${d}" ${base}/>`;
          }
          case 'ground': {
            const dx = s.x2 - s.x1, dy = s.y2 - s.y1, len = Math.hypot(dx, dy);
            if (len < 1) return '';
            const ux = dx / len, uy = dy / len;
            let px = -uy, py = ux;
            if (py < 0) { px = -px; py = -py; }
            const hx = (-ux + px) * Math.SQRT1_2, hy = (-uy + py) * Math.SQRT1_2;
            const hm = Math.hypot(hx, hy);
            const hnx = hx / hm, hny = hy / hm;
            const hLen = 10, spacing = 14;
            const col = '#1a2540';
            const gb = `fill="none" stroke="${col}" stroke-linecap="round"`;
            const segs = [`<line x1="${this.r2(s.x1)}" y1="${this.r2(s.y1)}" x2="${this.r2(s.x2)}" y2="${this.r2(s.y2)}" ${gb} stroke-width="1.5"/>`];
            let t = spacing * 0.5;
            while (t <= len) {
              const bx = s.x1 + ux * t, by = s.y1 + uy * t;
              segs.push(`<line x1="${this.r2(bx)}" y1="${this.r2(by)}" x2="${this.r2(bx + hnx * hLen)}" y2="${this.r2(by + hny * hLen)}" ${gb} stroke-width="1"/>`);
              t += spacing;
            }
            return segs.join('\n');
          }
          case 'ruler': {
            const dx = s.x2 - s.x1, dy = s.y2 - s.y1, len = Math.hypot(dx, dy);
            if (len < 1) return '';
            const ux = dx / len, uy = dy / len, px = -uy, py = ux, tH = 8;
            const dist = len * this.unitScale;
            const label = dist < 100 ? dist.toFixed(2) + ' cm' : (dist / 100).toFixed(3) + ' m';
            const mx = (s.x1 + s.x2) / 2, my = (s.y1 + s.y2) / 2;
            const lx = mx + px * (tH * 2 + 4), ly = my + py * (tH * 2 + 4);
            const col = '#b08800';
            const rb = `fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round"`;
            return [
              `<line x1="${this.r2(s.x1)}" y1="${this.r2(s.y1)}" x2="${this.r2(s.x2)}" y2="${this.r2(s.y2)}" ${rb}/>`,
              `<line x1="${this.r2(s.x1 + px * tH)}" y1="${this.r2(s.y1 + py * tH)}" x2="${this.r2(s.x1 - px * tH)}" y2="${this.r2(s.y1 - py * tH)}" ${rb}/>`,
              `<line x1="${this.r2(s.x2 + px * tH)}" y1="${this.r2(s.y2 + py * tH)}" x2="${this.r2(s.x2 - px * tH)}" y2="${this.r2(s.y2 - py * tH)}" ${rb}/>`,
              `<text x="${this.r2(lx)}" y="${this.r2(ly)}" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="${col}">${label}</text>`,
            ].join('\n');
          }
        }
        return '';
      }

      svgToCanvas(svgStr, w, h, dpr = 4) {
        return new Promise(resolve => {
          const blob = new Blob([svgStr], { type: 'image/svg+xml' });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => {
            const oc = document.createElement('canvas');
            oc.width = Math.ceil(w * dpr);
            oc.height = Math.ceil(h * dpr);
            oc.getContext('2d').drawImage(img, 0, 0, oc.width, oc.height);
            URL.revokeObjectURL(url);
            resolve(oc);
          };
          img.src = url;
        });
      }

      dlBlob(name, mime, content) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([content], { type: mime }));
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }

      dlDataURL(name, dataURL) {
        const a = document.createElement('a');
        a.href = dataURL; a.download = name; a.click();
      }

      doSave() {
        const data = {
          version: 2, GRID: this.GRID, unitScale: this.unitScale,
          layers: this.layers, shapes: this.shapes
        };
        this.dlBlob('microcad.mcad', 'application/json', JSON.stringify(data, null, 2));
      }

      doOpen() {
        document.getElementById('fileInput').click();
      }

      _onFileInput(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            this.shapes = (data.shapes || []);
            if (data.GRID) { this.GRID = data.GRID; document.getElementById('gridSize').value = this.GRID; }
            if (data.unitScale) { this.unitScale = data.unitScale; document.getElementById('rulerScale').value = this.unitScale; }
            if (data.layers && data.layers.length) {
              this.layers = data.layers;
              this.nextLayerId = Math.max(...this.layers.map(l => l.id)) + 1;
              this.activeLayerId = this.layers[this.layers.length - 1].id;
            } else {
              this.layers = [{ id: 1, name: 'Capa 1', opacity: 1, visible: true }];
              this.nextLayerId = 2; this.activeLayerId = 1;
              this.shapes.forEach(s => { if (!s.layerId) s.layerId = 1; });
            }
            this.history = [{ shapes: [], layers: JSON.parse(JSON.stringify(this.layers)) }];
            this.histIdx = 0;
            this.commit();
            this.renderLayersPanel();
            this.cancelOp();
          } catch (err) { alert('Error al abrir el archivo:\n' + err.message); }
        };
        reader.readAsText(file);
        e.target.value = '';
      }

      async doExportSVG() {
        this.dlBlob('microcad.svg', 'image/svg+xml', this.buildSVGString());
      }

      async doExportPNG() {
        const svgStr = this.buildSVGString();
        const bbox = this.getShapesBBox();
        const m = this.EXPORT_MARGIN;
        const vw = Math.max(1, bbox.maxX - bbox.minX + m * 2);
        const vh = Math.max(1, bbox.maxY - bbox.minY + m * 2);
        const oc = await this.svgToCanvas(svgStr, vw, vh);
        this.dlDataURL('microcad.png', oc.toDataURL('image/png'));
      }

      async doExportPDF() {
        if (!window.jspdf) { alert('jsPDF no disponible.'); return; }
        const { jsPDF } = window.jspdf;

        const bbox = this.getShapesBBox();
        const m    = this.EXPORT_MARGIN;
        const ox   = bbox.minX - m;  
        const oy   = bbox.minY - m;
        const vw   = Math.max(1, bbox.maxX - bbox.minX + m * 2);
        const vh   = Math.max(1, bbox.maxY - bbox.minY + m * 2);

        const A1_PT = 2384;
        const sf    = Math.min(200 / 96, A1_PT / Math.max(vw, vh));
        const pw    = vw * sf;
        const ph    = vh * sf;

        const tx = wx => (wx - ox) * sf;
        const ty = wy => (wy - oy) * sf;

        const pdf = new jsPDF({ orientation: pw >= ph ? 'l' : 'p', unit: 'pt', format: [pw, ph] });

        pdf.setFillColor(255, 255, 255);
        pdf.rect(0, 0, pw, ph, 'F');

        if (this.gridVisible) {
          const { GRID, GRID_MAJOR } = this;
          const x0 = Math.floor(bbox.minX / GRID) * GRID;
          const y0 = Math.floor(bbox.minY / GRID) * GRID;
          const x1 = Math.ceil(bbox.maxX / GRID) * GRID;
          const y1 = Math.ceil(bbox.maxY / GRID) * GRID;

          // minor grid
          pdf.setDrawColor(220, 220, 220);
          pdf.setLineWidth(0.15);
          for (let gx = x0; gx <= x1; gx += GRID) {
            if ((Math.round(gx / GRID) % GRID_MAJOR) === 0) continue;
            pdf.line(tx(gx), ty(bbox.minY - m * 0.5), tx(gx), ty(bbox.maxY + m * 0.5));
          }
          for (let gy = y0; gy <= y1; gy += GRID) {
            if ((Math.round(gy / GRID) % GRID_MAJOR) === 0) continue;
            pdf.line(tx(bbox.minX - m * 0.5), ty(gy), tx(bbox.maxX + m * 0.5), ty(gy));
          }
          pdf.setDrawColor(190, 190, 190);
          pdf.setLineWidth(0.35);
          for (let gx = x0; gx <= x1; gx += GRID) {
            if ((Math.round(gx / GRID) % GRID_MAJOR) !== 0) continue;
            pdf.line(tx(gx), ty(bbox.minY - m * 0.5), tx(gx), ty(bbox.maxY + m * 0.5));
          }
          for (let gy = y0; gy <= y1; gy += GRID) {
            if ((Math.round(gy / GRID) % GRID_MAJOR) !== 0) continue;
            pdf.line(tx(bbox.minX - m * 0.5), ty(gy), tx(bbox.maxX + m * 0.5), ty(gy));
          }
        }

        this.layers.forEach(layer => {
          if (!layer.visible) return;
          this.shapes.forEach(s => {
            if ((s.layerId || 1) !== layer.id) return;
            this._drawShapePDF(pdf, s, layer, tx, ty, sf);
          });
        });

        pdf.save('microcad.pdf');
      }

      _drawShapePDF(pdf, s, layer, tx, ty, sf) {
        if (s.type === 'group') {
          s.children.forEach(c => this._drawShapePDF(pdf, c, layer, tx, ty, sf));
          return;
        }
        const opacity = layer.opacity ?? 1;
        try {
          pdf.saveGraphicsState();
          const gs = new pdf.GState({ opacity, 'stroke-opacity': opacity });
          pdf.setGState(gs);
        } catch (_) { console.error('pdf failed'); }
        
        pdf.setDrawColor(20, 30, 55);
        pdf.setLineCap('round');
        pdf.setLineJoin('round');

        switch (s.type) {
          case 'line': {
            pdf.setLineWidth(0.75);
            pdf.line(tx(s.x1), ty(s.y1), tx(s.x2), ty(s.y2));
            break;
          }
          case 'rect': {
            pdf.setLineWidth(0.75);
            pdf.rect(tx(s.x), ty(s.y), s.w * sf, s.h * sf, 'S');
            break;
          }
          case 'circle': {
            if (s.r < 0.01) break;
            pdf.setLineWidth(0.75);
            pdf.circle(tx(s.cx), ty(s.cy), s.r * sf, 'S');
            break;
          }
          case 'triangle': {
            const p1x = tx(s.p1.x), p1y = ty(s.p1.y);
            const p2x = tx(s.p2.x), p2y = ty(s.p2.y);
            const p3x = tx(s.p3.x), p3y = ty(s.p3.y);
            pdf.setLineWidth(0.75);
            pdf.lines(
              [[p2x - p1x, p2y - p1y], [p3x - p2x, p3y - p2y]],
              p1x, p1y, [1, 1], 'S', true
            );
            break;
          }
          case 'arc': {
            if (!s.r || s.r < 0.01) break;
            // Approximate arc as polyline (≤ 7.5° per step)
            let span;
            if (!s.ccw) {
              span = s.ea - s.sa;
              while (span < 0) span += 2 * Math.PI;
              while (span >= 2 * Math.PI) span -= 2 * Math.PI;
            } else {
              span = s.ea - s.sa;
              while (span > 0) span -= 2 * Math.PI;
              while (span <= -2 * Math.PI) span += 2 * Math.PI;
            }
            const steps = Math.max(12, Math.ceil(Math.abs(span) / (Math.PI / 24)));
            const pts = [];
            for (let i = 0; i <= steps; i++) {
              const a = s.sa + (i / steps) * span;
              pts.push([tx(s.cx + s.r * Math.cos(a)), ty(s.cy + s.r * Math.sin(a))]);
            }
            const segs = [];
            for (let i = 1; i < pts.length; i++) {
              segs.push([pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]]);
            }
            pdf.setLineWidth(0.75);
            pdf.lines(segs, pts[0][0], pts[0][1], [1, 1], 'S', false);
            break;
          }
          case 'poly': {
            if (!s.pts || s.pts.length < 2) break;
            const ppts = s.pts.map(p => [tx(p.x), ty(p.y)]);
            const psegs = [];
            for (let i = 1; i < ppts.length; i++)
              psegs.push([ppts[i][0] - ppts[i-1][0], ppts[i][1] - ppts[i-1][1]]);
            pdf.setLineWidth(0.75);
            pdf.lines(psegs, ppts[0][0], ppts[0][1], [1, 1], 'S', !!s.closed);
            break;
          }
          case 'ground': {
            const dx  = s.x2 - s.x1, dy = s.y2 - s.y1;
            const len = Math.hypot(dx, dy);
            if (len < 1) break;
            const ux = dx / len, uy = dy / len;
            let px = -uy, py = ux;
            if (py < 0) { px = -px; py = -py; }
            const hx = (-ux + px) * Math.SQRT1_2;
            const hy = (-uy + py) * Math.SQRT1_2;
            const hMag = Math.hypot(hx, hy);
            const hnx = hx / hMag, hny = hy / hMag;
            const hLen = 10, spacing = 14;

            pdf.setLineWidth(0.75);
            pdf.line(tx(s.x1), ty(s.y1), tx(s.x2), ty(s.y2));

            pdf.setLineWidth(0.4);
            for (let t = spacing * 0.5; t <= len; t += spacing) {
              const bx = s.x1 + ux * t, by = s.y1 + uy * t;
              pdf.line(tx(bx), ty(by), tx(bx + hnx * hLen), ty(by + hny * hLen));
            }
            break;
          }
          case 'ruler': {
            const dx  = s.x2 - s.x1, dy = s.y2 - s.y1;
            const len = Math.hypot(dx, dy);
            if (len < 1) break;
            const ux = dx / len, uy = dy / len;
            const rpx = -uy, rpy = ux;
            const tickH = 8;  // world units

            pdf.setDrawColor(160, 100, 0);
            pdf.setLineWidth(0.5);
            pdf.line(tx(s.x1), ty(s.y1), tx(s.x2), ty(s.y2));

            [[s.x1, s.y1], [s.x2, s.y2]].forEach(([qx, qy]) => {
              pdf.line(
                tx(qx + rpx * tickH), ty(qy + rpy * tickH),
                tx(qx - rpx * tickH), ty(qy - rpy * tickH)
              );
            });

            const dist = len * this.unitScale;
            const label = dist < 100
              ? dist.toFixed(2) + ' cm'
              : (dist / 100).toFixed(3) + ' m';

            const mx = (s.x1 + s.x2) / 2;
            const my = (s.y1 + s.y2) / 2;
            const offset = tickH * 2 + 3;
            const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;

            pdf.setFontSize(8);
            pdf.setTextColor(120, 70, 0);
            try {
              pdf.text(label, tx(mx + rpx * offset), ty(my + rpy * offset),
                { angle: -angleDeg, align: 'center' });
            } catch (_) {
              pdf.text(label, tx(mx), ty(my));
            }
            break;
          }
        }

        try { pdf.restoreGraphicsState(); } catch (_) { console.error('pdf failed'); }
      }

      saveDraft() {
        try {
          localStorage.setItem(this.DRAFT_KEY, JSON.stringify({
            version: 2, GRID: this.GRID, unitScale: this.unitScale,
            layers: this.layers, shapes: this.shapes,
          }));
          this.draftEl.textContent = '● borrador guardado';
          this.draftEl.classList.add('show');
          clearTimeout(this.draftFadeTimer);
          this.draftFadeTimer = setTimeout(() => this.draftEl.classList.remove('show'), 2000);
        } catch (e) { }
      }

      loadDraft() {
        try {
          const raw = localStorage.getItem(this.DRAFT_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (!data.shapes || !data.shapes.length) return;
          if (!confirm('Se encontró un borrador guardado. ¿Deseas restaurarlo?')) return;
          this.shapes = data.shapes;
          if (data.GRID) { this.GRID = data.GRID; document.getElementById('gridSize').value = this.GRID; }
          if (data.unitScale) { this.unitScale = data.unitScale; document.getElementById('rulerScale').value = this.unitScale; }
          if (data.layers && data.layers.length) {
            this.layers = data.layers;
            this.nextLayerId = Math.max(...this.layers.map(l => l.id)) + 1;
            this.activeLayerId = this.layers[this.layers.length - 1].id;
          } else {
            this.layers = [{ id: 1, name: 'Capa 1', opacity: 1, visible: true }];
            this.nextLayerId = 2; this.activeLayerId = 1;
            this.shapes.forEach(s => { if (!s.layerId) s.layerId = 1; });
          }
          this.history = [{ shapes: [], layers: JSON.parse(JSON.stringify(this.layers)) }];
          this.histIdx = 0;
          this.commit(); this.renderLayersPanel(); this.cancelOp();
        } catch (e) { }
      }
    }


    const app = new MicroCAD({
      GRID: 20, GRID_MAJOR: 5,
      MIN_SCALE: 0.04, MAX_SCALE: 80, ZOOM_STEP: 1.25,
      EXPORT_MARGIN: 40, DRAFT_KEY: 'microcad_draft',
    });
    app.init();
  </script>
</body>
